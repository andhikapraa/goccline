# goccline example config — drop this at ~/.claude/goccline/Config.toml or
# wherever $GOCCLINE_CONFIG points.
#
# This format mirrors the bash claude-code-statusline so you can migrate
# directly. Unknown keys are tolerated.

[theme]
name = "catppuccin"

[features]
show_commits = true
show_version = true
show_submodules = true

[session_info]
# Append the first user message from the transcript to the session ID,
# truncated. OFF by default — adds ~130ms per render due to transcript I/O.
# show_first_message = true
# id_length = 8
# title_length = 40

[display]
lines = 2

[display.line1]
components = ["repo_info", "session_info"]
separator = " │ "
show_when_empty = true

[display.line2]
components = ["model_info", "session_mode", "version_info", "time_display"]
separator = " │ "
show_when_empty = true
